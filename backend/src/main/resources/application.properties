# CareLoop Spring Boot Configuration
spring.application.name=careloop

# MySQL Database - update username/password for your local setup
spring.datasource.url=jdbc:mysql://localhost:3306/careloop?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root123

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Server port
server.port=8080

# JWT secret (change in production)
careloop.jwt.secret=CareLoopSecretKeyForJWTTokenGeneration2024MustBeLongEnough
careloop.jwt.expiration=86400000

# Food expiry hours
careloop.food.expiry-hours=4
