<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Donor Dashboard - CareLoop</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="navContainer"></div>

  <main class="dashboard">
    <div class="dashboard-header">
      <h1>Donor Dashboard</h1>
      <div class="trust-badge">
        <div class="trust-score">
          <div class="value" id="trustValue">—</div>
          <div class="label">Reliability</div>
        </div>
        <div class="trust-score">
          <div class="value" id="ratingValue">—</div>
          <div class="label">Rating</div>
        </div>
        <div class="trust-score">
          <div class="value" id="cancelValue">0</div>
          <div class="label">Cancellations</div>
        </div>
        <span id="unreliableTag" class="unreliable-tag hidden">Unreliable</span>
      </div>
    </div>

    <div class="dashboard-grid">
      <section class="panel">
        <h2>Add Donation</h2>
        <form id="donationForm">
          <div class="form-group">
            <label>Type</label>
            <select id="type" required>
              <option value="FOOD">Food</option>
              <option value="CLOTHES">Clothes</option>
              <option value="BOOKS">Books</option>
              <option value="ESSENTIALS">Essentials</option>
            </select>
          </div>
          <div class="form-group">
            <label>Quantity</label>
            <input type="number" id="quantity" min="1" required value="1">
          </div>
          <div class="form-group">
            <label>Location</label>
            <input type="text" id="location" required placeholder="Area, city">
          </div>
          <div id="foodFields" class="food-fields">
            <div class="form-group">
              <label>Prepared Time</label>
              <input type="datetime-local" id="preparedTime">
            </div>
            <div class="form-group">
              <label>Veg / Non-Veg</label>
              <select id="vegType">
                <option value="VEG">Vegetarian</option>
                <option value="NON_VEG">Non-Vegetarian</option>
              </select>
            </div>
          </div>
          <button type="submit" class="btn btn-primary btn-block">Submit Donation</button>
        </form>
      </section>

      <section class="panel">
        <h2>My Donations</h2>
        <div class="filters">
          <select id="filterType">
            <option value="">All types</option>
            <option value="FOOD">Food</option>
            <option value="CLOTHES">Clothes</option>
            <option value="BOOKS">Books</option>
            <option value="ESSENTIALS">Essentials</option>
          </select>
          <input type="text" id="filterLocation" placeholder="Filter by location">
          <button class="btn btn-outline btn-sm" id="applyFilter">Filter</button>
        </div>
        <div class="donations-list" id="donationsList"></div>
      </section>
    </div>
  </main>

  <!-- Cancel modal -->
  <div class="modal-overlay" id="cancelModal">
    <div class="modal">
      <h3>Cancel Donation</h3>
      <p style="margin-bottom:1rem;color:var(--text-muted);font-size:0.9rem;">
        Please provide a reason. Frequent cancellations affect your trust score.
      </p>
      <form id="cancelForm">
        <input type="hidden" id="cancelDonationId">
        <div class="form-group">
          <label>Reason</label>
          <textarea id="cancelReason" rows="3" required placeholder="Why are you cancelling?"></textarea>
        </div>
        <div style="display:flex;gap:0.5rem;">
          <button type="submit" class="btn btn-danger">Confirm Cancel</button>
          <button type="button" class="btn btn-outline" onclick="closeCancelModal()">Back</button>
        </div>
      </form>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/notifications.js"></script>
  <script src="js/donations.js"></script>
  <script>
    const user = requireAuth('DONOR');
    if (!user) throw new Error('auth');

    document.getElementById('navContainer').innerHTML = buildDashboardNav(user);
    initNotifications();
    loadTrustScore();

    const typeSelect = document.getElementById('type');
    const foodFields = document.getElementById('foodFields');

    typeSelect.addEventListener('change', () => {
      foodFields.classList.toggle('show', typeSelect.value === 'FOOD');
    });
    foodFields.classList.add('show');

    document.getElementById('donationForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const body = {
        type: typeSelect.value,
        quantity: parseInt(document.getElementById('quantity').value),
        location: document.getElementById('location').value
      };
      if (body.type === 'FOOD') {
        const pt = document.getElementById('preparedTime').value;
        if (pt) body.preparedTime = pt;
        body.vegType = document.getElementById('vegType').value;
      }
      try {
        await DonationAPI.create(body);
        document.getElementById('donationForm').reset();
        foodFields.classList.add('show');
        loadDonations();
      } catch (err) {
        alert(err.message);
      }
    });

    document.getElementById('applyFilter').addEventListener('click', loadDonations);

    async function loadDonations() {
      const type = document.getElementById('filterType').value;
      const location = document.getElementById('filterLocation').value;
      try {
        const list = await DonationAPI.list(type, location);
        renderDonations(document.getElementById('donationsList'), list, (d) => {
          if (['PENDING', 'VERIFIED', 'ASSIGNED'].includes(d.status)) {
            return `<button class="btn btn-danger btn-sm" onclick="showCancelModal(${d.id}, loadDonations)">Cancel</button>`;
          }
          return '';
        });
      } catch (err) {
        alert(err.message);
      }
    }

    loadDonations();
    setInterval(loadDonations, 60000);
  </script>
</body>
</html>
