<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up - CareLoop</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="navbar">
    <a href="index.html" class="logo"><span class="logo-icon">♻</span> CareLoop</a>
    <div class="nav-links"><a href="login.html">Login</a></div>
  </nav>

  <div class="auth-container">
    <div class="auth-card">
      <h2>Join CareLoop</h2>
      <p class="subtitle">Choose your role in the kindness loop</p>
      <div id="alertBox" class="alert alert-error hidden"></div>

      <form id="signupForm">
        <div class="form-group">
          <label for="name">Full Name</label>
          <input type="text" id="name" required placeholder="Your name">
        </div>
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" required placeholder="you@example.com">
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" required minlength="6" placeholder="Min 6 characters">
        </div>
        <div class="form-group">
          <label for="role">I am a...</label>
          <select id="role" required>
            <option value="">Select role</option>
            <option value="DONOR">Donor — I want to give items</option>
            <option value="NGO">NGO — I verify donations</option>
            <option value="VOLUNTEER">Volunteer — I deliver items</option>
          </select>
        </div>
        <button type="submit" class="btn btn-primary btn-block">Create Account</button>
      </form>

      <p class="auth-footer">Already have an account? <a href="login.html">Login</a></p>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script>
    const user = getUser();
    if (user) redirectToDashboard(user.role);

    document.getElementById('signupForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const alertBox = document.getElementById('alertBox');
      alertBox.classList.add('hidden');

      try {
        const res = await AuthAPI.register({
          name: document.getElementById('name').value,
          email: document.getElementById('email').value,
          password: document.getElementById('password').value,
          role: document.getElementById('role').value
        });
        saveAuth(res);
        redirectToDashboard(res.role);
      } catch (err) {
        alertBox.textContent = err.message;
        alertBox.classList.remove('hidden');
      }
    });
  </script>
</body>
</html>
