<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - CareLoop</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="navbar">
    <a href="index.html" class="logo"><span class="logo-icon">♻</span> CareLoop</a>
    <div class="nav-links">
      <a href="signup.html">Sign Up</a>
    </div>
  </nav>

  <div class="auth-container">
    <div class="auth-card">
      <h2>Welcome Back</h2>
      <p class="subtitle">Login to continue your kindness loop</p>
      <div id="alertBox" class="alert alert-error hidden"></div>

      <form id="loginForm">
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" required placeholder="you@example.com">
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" required placeholder="••••••••">
        </div>
        <button type="submit" class="btn btn-primary btn-block">Login</button>
      </form>

      <p class="auth-footer">Don't have an account? <a href="signup.html">Sign up</a></p>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script>
    // Redirect if already logged in
    const user = getUser();
    if (user) redirectToDashboard(user.role);

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const alertBox = document.getElementById('alertBox');
      alertBox.classList.add('hidden');

      try {
        const res = await AuthAPI.login({
          email: document.getElementById('email').value,
          password: document.getElementById('password').value
        });
        saveAuth(res);
        redirectToDashboard(res.role);
      } catch (err) {
        alertBox.textContent = err.message;
        alertBox.classList.remove('hidden');
      }
    });
  </script>
</body>
</html>
